<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>pi-tail | Telemetry Monitor</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>pi-tail</h2>
            </div>
            <nav id="log-list" class="log-list">
                <!-- Log files will be populated here -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="app-header">
                <h1 id="current-log-title">Select a log file</h1>
                <div style="display: flex; align-items: center; gap: 1rem">
                    <input
                        type="text"
                        id="log-filter"
                        placeholder="Filter logs..."
                    />
                    <button
                        id="view-toggle"
                        class="theme-toggle"
                        aria-label="Toggle View"
                    >
                        Traces View
                    </button>
                    <button
                        id="theme-toggle"
                        class="theme-toggle"
                        aria-label="Toggle Theme"
                    ></button>
                    <button
                        id="pause-toggle"
                        class="theme-toggle"
                        aria-label="Pause Stream"
                    ></button>
                    <div id="connection-status" class="status disconnected">
                        Disconnected
                    </div>
                </div>
            </header>

            <!-- Sticky Metrics HUD -->
            <div id="metrics-hud">
                <div>
                    <span>Input Tokens:</span>
                    <strong id="hud-tokens-in">-</strong>
                </div>
                <div>
                    <span>Output Tokens:</span>
                    <strong id="hud-tokens-out">-</strong>
                </div>
                <div>
                    <span>Reasoning Tokens:</span>
                    <strong id="hud-tokens-reasoning">-</strong>
                </div>
                <div>
                    <span>Error Rate:</span> <strong id="hud-errors">-</strong>
                </div>
            </div>

            <!-- Dual Views -->
            <div id="timeline"></div>
            <div id="traces-view"></div>
        </main>
        <script type="module" src="./app.js"></script>
    </body>
</html>
